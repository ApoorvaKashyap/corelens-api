[project]
name = "corelens-api"
version = "0.1.0"
authors = [{ name = "Apoorva Kashyap" }]
description = "The querying API for core-lens library"
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
license-files = ["LICEN[CS]E*"]
dependencies = [
    "core-lens[stats]>=0.1.dev175",
    "fastapi[standard]>=0.140.7",
    "strawberry-graphql[fastapi]>=0.323.2",
    "loguru>=0.7.3",
    "polars>=1.43.1",
]

[dependency-groups]
dev = ["ruff>=0.15.8", "mypy>=1.20.2", "pip-audit>=2.10.0", "pre-commit>=4.6.0"]
docs = [
    "myst-parser>=5.1.0",
    "shibuya>=2026.5.19",
    "sphinx>=9.1.0",
    "sphinx-autoapi>=3.8.0",
    "sphinx-autobuild>=2025.8.25",
    "sphinx-copybutton>=0.5.2",
    "sphinxcontrib-mermaid>=2.0.2",
]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy", "strawberry.ext.mypy_plugin"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false


[tool.ruff.lint]
select = [
    "E",
    "F", # Default rules (Error and Pyflakes)
    "S", # Enable all flake8-bandit security rules
]
ignore = [
    "E501", # line too long
    "S101", # use of assert
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"examples/*" = ["S"]

[tool.ruff.lint.pydocstyle]
convention = "google"
